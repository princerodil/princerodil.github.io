<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TinyTots Accessories — Online Store</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-pink-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="bg-white shadow-sm px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <a href="#" onclick="router('home')" class="text-xl font-bold text-pink-600 flex items-center gap-2">
            👶 TinyTots Accessories
        </a>
        <div class="space-x-4 flex items-center">
            <button onclick="router('home')" class="hover:text-pink-600 font-medium">Home</button>
            <button onclick="router('catalog')" class="hover:text-pink-600 font-medium">Catalog</button>
            <button onclick="router('cart')" class="relative hover:text-pink-600 font-medium flex items-center gap-1">
                🛒 Cart <span id="cart-badge" class="bg-pink-600 text-white text-xs px-1.5 py-0.5 rounded-full">0</span>
            </button>
            <span id="nav-auth-area"></span>
        </div>
    </nav>

    <!-- Main Dynamic Content Container -->
    <main class="flex-grow container mx-auto px-4 py-8 max-w-6xl">
        <div id="app"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-4 text-center text-sm text-slate-500">
        TinyTots Accessories System &copy; 2026 | Midterm Task Performance
    </footer>

    <!-- Application JavaScript Logic -->
    <script>
        // --- INITIAL PRODUCTS DATA ---
        const initialProducts = [
            { id: 1, name: 'Silicone Pacifier Clip', category: 'Bibs & Pacifiers', price: 8.99, image: 'https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=500', description: 'Food-grade silicone teether clip to prevent dropped pacifiers.' },
            { id: 2, name: 'Organic Cotton Baby Beanie', category: 'Apparel', price: 12.50, image: 'https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=500', description: 'Soft organic cotton cap to keep newborn heads warm.' },
            { id: 3, name: 'Waterproof Bandana Bibs Set', category: 'Bibs & Pacifiers', price: 15.99, image: 'https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=500', description: 'Absorbent organic cotton bandana bibs with adjustable snaps.' },
            { id: 4, name: 'Wooden Ring Plush Teether', category: 'Toys & Teethers', price: 9.75, image: 'https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=500', description: 'Natural beechwood ring with knitted animal face for teething relief.' },
            { id: 5, name: 'Non-Slip Baby Booties', category: 'Footwear & Socks', price: 14.20, image: 'https://images.unsplash.com/photo-1519689680058-324335c77eba?w=500', description: 'Soft fleece booties with snap closures that stay secure on tiny feet.' },
            { id: 6, name: 'Sensory Crinkle Baby Toy', category: 'Toys & Teethers', price: 11.00, image: 'https://images.unsplash.com/photo-1596461404969-9ae70f2830c1?w=500', description: 'High-contrast tactile toy designed for early sensory development.' },
            { id: 7, name: 'Scratch Mittens Set (3-Pack)', category: 'Apparel', price: 10.50, image: 'https://images.unsplash.com/photo-1522771739844-6a9f6d5f14af?w=500', description: '100% gentle cotton mittens designed to protect soft skin from scratches.' },
            { id: 8, name: 'Knitted Knee-High Socks', category: 'Footwear & Socks', price: 8.50, image: 'https://images.unsplash.com/photo-1519689680058-324335c77eba?w=500', description: 'Cozy breathable knitted socks for infants and toddlers.' }
        ];

        // --- LOCALSTORAGE SETUP ---
        if (!localStorage.getItem('users')) {
            localStorage.setItem('users', JSON.stringify([
                { name: 'Store Admin', email: 'admin@tinytots.com', password: 'admin123', role: 'admin' },
                { name: 'Jane Doe', email: 'jane@example.com', password: 'user123', role: 'customer' }
            ]));
        }

        if (!localStorage.getItem('products') || JSON.parse(localStorage.getItem('products')).length < 8) {
            localStorage.setItem('products', JSON.stringify(initialProducts));
        }

        if (!localStorage.getItem('cart')) {
            localStorage.setItem('cart', JSON.stringify([]));
        }

        let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;

        function updateCartBadge() {
            const cart = JSON.parse(localStorage.getItem('cart'));
            const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
            document.getElementById('cart-badge').innerText = totalCount;
        }

        // --- ROUTER SYSTEM ---
        function router(view, param = null) {
            updateNavbar();
            updateCartBadge();
            const app = document.getElementById('app');
            app.innerHTML = '';

            if (view === 'home') renderHome(app);
            else if (view === 'login') renderLogin(app);
            else if (view === 'register') renderRegister(app);
            else if (view === 'catalog') renderCatalog(app);
            else if (view === 'cart') renderCart(app);
            else if (view === 'checkout') renderCheckout(app);
            else if (view === 'dashboard') renderDashboard(app);
            else if (view === 'edit' && param) renderEditProduct(app, param);
        }

        function updateNavbar() {
            const area = document.getElementById('nav-auth-area');
            if (currentUser) {
                let adminLink = currentUser.role === 'admin' ? `<button onclick="router('dashboard')" class="bg-pink-100 text-pink-700 px-3 py-1 rounded font-medium hover:bg-pink-200">Dashboard</button>` : '';
                area.innerHTML = `${adminLink} <span class="font-bold text-slate-700">${currentUser.name}</span> <button onclick="logout()" class="text-red-500 font-medium hover:underline ml-2">Logout</button>`;
            } else {
                area.innerHTML = `<button onclick="router('login')" class="text-pink-600 font-medium">Login</button> <button onclick="router('register')" class="bg-pink-600 text-white px-4 py-2 rounded shadow hover:bg-pink-700">Register</button>`;
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            router('home');
        }

        // --- CART FUNCTIONS ---
        function addToCart(productId) {
            const products = JSON.parse(localStorage.getItem('products'));
            const product = products.find(p => p.id === productId);
            let cart = JSON.parse(localStorage.getItem('cart'));

            const existing = cart.find(item => item.id === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                cart.push({ ...product, qty: 1 });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartBadge();
            alert(`${product.name} added to cart!`);
        }

        function buyNow(productId) {
            addToCart(productId);
            router('cart');
        }

        // --- VIEWS ---

        function renderHome(container) {
            const products = JSON.parse(localStorage.getItem('products')).slice(0, 3);
            let featuredCards = '';
            products.forEach(p => {
                featuredCards += `
                    <div class="bg-white rounded-xl shadow p-4 flex flex-col justify-between">
                        <img src="${p.image}" class="h-40 w-full object-cover rounded-lg mb-3">
                        <div>
                            <span class="text-xs bg-pink-100 text-pink-700 px-2 py-1 rounded font-bold">${p.category}</span>
                            <h3 class="text-md font-bold mt-2">${p.name}</h3>
                        </div>
                        <div class="mt-3 flex justify-between items-center">
                            <span class="text-lg font-extrabold text-pink-600">$${p.price.toFixed(2)}</span>
                            <button onclick="buyNow(${p.id})" class="bg-pink-600 text-white px-3 py-1 rounded text-xs font-bold hover:bg-pink-700">Buy Now</button>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = `
                <div class="text-center py-10">
                    <h1 class="text-4xl font-extrabold text-slate-900 mb-4">Adorable & Safe Accessories for Little Ones</h1>
                    <p class="text-slate-600 max-w-xl mx-auto mb-8">Explore handpicked organic cotton beanies, silicone teethers, soft bibs, and booties tailored for ultimate baby comfort.</p>
                    <button onclick="router('catalog')" class="bg-pink-600 text-white px-6 py-3 rounded-lg font-bold shadow-lg hover:bg-pink-700">Browse Full Catalog</button>
                </div>
                <div class="mt-8">
                    <h2 class="text-2xl font-bold mb-4 text-slate-800">Featured Essentials</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">${featuredCards}</div>
                </div>
            `;
        }

        function renderLogin(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md">
                    <h2 class="text-2xl font-bold mb-6 text-center text-pink-600">Sign In</h2>
                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div><label class="block text-sm font-bold">Email</label><input type="email" id="login-email" required class="w-full border p-2 rounded mt-1"></div>
                        <div><label class="block text-sm font-bold">Password</label><input type="password" id="login-password" required class="w-full border p-2 rounded mt-1"></div>
                        <button type="submit" class="w-full bg-pink-600 text-white py-2 rounded font-bold hover:bg-pink-700">Login</button>
                    </form>
                    <div class="text-xs text-slate-500 mt-6 bg-slate-50 p-3 rounded border">
                        <p class="font-bold">Test Credentials:</p>
                        <p>• Admin: admin@tinytots.com / admin123</p>
                        <p>• Customer: jane@example.com / user123</p>
                    </div>
                </div>
            `;
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const users = JSON.parse(localStorage.getItem('users'));
            const found = users.find(u => u.email === email && u.password === pass);

            if (found) {
                currentUser = found;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                router(found.role === 'admin' ? 'dashboard' : 'catalog');
            } else {
                alert('Invalid email or password!');
            }
        }

        function renderRegister(container) {
            container.innerHTML = `
                <div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md">
                    <h2 class="text-2xl font-bold mb-6 text-center text-pink-600">Create Account</h2>
                    <form onsubmit="handleRegister(event)" class="space-y-4">
                        <div><label class="block text-sm font-bold">Full Name</label><input type="text" id="reg-name" required class="w-full border p-2 rounded mt-1"></div>
                        <div><label class="block text-sm font-bold">Email</label><input type="email" id="reg-email" required class="w-full border p-2 rounded mt-1"></div>
                        <div><label class="block text-sm font-bold">Password</label><input type="password" id="reg-password" required class="w-full border p-2 rounded mt-1"></div>
                        <button type="submit" class="w-full bg-pink-600 text-white py-2 rounded font-bold hover:bg-pink-700">Register</button>
                    </form>
                </div>
            `;
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            let users = JSON.parse(localStorage.getItem('users'));

            if (users.some(u => u.email === email)) {
                alert('Email already registered!');
                return;
            }

            users.push({ name, email, password, role: 'customer' });
            localStorage.setItem('users', JSON.stringify(users));
            alert('Registration successful! Please login.');
            router('login');
        }

        function renderCatalog(container) {
            const products = JSON.parse(localStorage.getItem('products'));
            let html = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold text-pink-600">Product Catalog</h2>
                    <span class="text-sm text-slate-500 font-medium">${products.length} Products Available</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-6">
            `;
            products.forEach(p => {
                html += `
                    <div class="bg-white rounded-xl shadow p-4 flex flex-col justify-between hover:shadow-md transition">
                        <img src="${p.image}" class="h-44 w-full object-cover rounded-lg mb-3">
                        <div class="flex-grow">
                            <span class="text-xs bg-pink-100 text-pink-700 px-2 py-1 rounded font-bold">${p.category}</span>
                            <h3 class="text-md font-bold mt-2 text-slate-800">${p.name}</h3>
                            <p class="text-slate-500 text-xs mt-1 line-clamp-2">${p.description}</p>
                        </div>
                        <div class="mt-4 pt-2 border-t flex flex-col gap-2">
                            <span class="text-lg font-extrabold text-pink-600">$${p.price.toFixed(2)}</span>
                            <div class="flex gap-2">
                                <button onclick="addToCart(${p.id})" class="flex-1 bg-slate-100 text-slate-700 py-1.5 rounded text-xs font-bold hover:bg-slate-200">Add to Cart</button>
                                <button onclick="buyNow(${p.id})" class="flex-1 bg-pink-600 text-white py-1.5 rounded text-xs font-bold hover:bg-pink-700">Buy Now</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html + `</div>`;
        }

        function renderCart(container) {
            let cart = JSON.parse(localStorage.getItem('cart'));
            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 bg-white rounded-xl shadow">
                        <h2 class="text-2xl font-bold text-slate-700 mb-2">Your Cart is Empty</h2>
                        <p class="text-slate-500 mb-6">Explore our adorable baby accessories and add items to your cart.</p>
                        <button onclick="router('catalog')" class="bg-pink-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-pink-700">Browse Catalog</button>
                    </div>
                `;
                return;
            }

            let total = 0;
            let itemsHtml = '';
            cart.forEach((item, index) => {
                let subtotal = item.price * item.qty;
                total += subtotal;
                itemsHtml += `
                    <tr class="border-b">
                        <td class="p-4 flex items-center gap-3">
                            <img src="${item.image}" class="w-12 h-12 object-cover rounded">
                            <span class="font-bold">${item.name}</span>
                        </td>
                        <td class="p-4">$${item.price.toFixed(2)}</td>
                        <td class="p-4">
                            <button onclick="updateQty(${index}, -1)" class="px-2 bg-slate-200 rounded">-</button>
                            <span class="px-2">${item.qty}</span>
                            <button onclick="updateQty(${index}, 1)" class="px-2 bg-slate-200 rounded">+</button>
                        </td>
                        <td class="p-4 font-bold">$${subtotal.toFixed(2)}</td>
                        <td class="p-4"><button onclick="removeItem(${index})" class="text-red-500 text-sm hover:underline">Remove</button></td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <h2 class="text-3xl font-bold text-pink-600 mb-6">Shopping Cart</h2>
                <div class="bg-white rounded-xl shadow overflow-x-auto mb-6">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-slate-100 text-slate-600 text-sm"><th class="p-4">Product</th><th class="p-4">Price</th><th class="p-4">Quantity</th><th class="p-4">Subtotal</th><th class="p-4">Action</th></tr></thead>
                        <tbody>${itemsHtml}</tbody>
                    </table>
                </div>
                <div class="bg-white p-6 rounded-xl shadow flex justify-between items-center max-w-xl ml-auto">
                    <div>
                        <p class="text-sm text-slate-500">Total Amount:</p>
                        <p class="text-3xl font-extrabold text-pink-600">$${total.toFixed(2)}</p>
                    </div>
                    <button onclick="router('checkout')" class="bg-pink-600 text-white px-8 py-3 rounded-lg font-bold hover:bg-pink-700 shadow">Proceed to Checkout</button>
                </div>
            `;
        }

        function updateQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('cart'));
            cart[index].qty += change;
            if (cart[index].qty <= 0) {
                cart.splice(index, 1);
            }
            localStorage.setItem('cart', JSON.stringify(cart));
            router('cart');
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('cart'));
            cart.splice(index, 1);
            localStorage.setItem('cart', JSON.stringify(cart));
            router('cart');
        }

        function renderCheckout(container) {
            container.innerHTML = `
                <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow">
                    <h2 class="text-2xl font-bold text-pink-600 mb-6">Secure Checkout</h2>
                    <form onsubmit="handleCheckout(event)" class="space-y-4">
                        <div><label class="block text-sm font-bold">Full Name</label><input type="text" required class="w-full border p-2 rounded mt-1" placeholder="Parent Name"></div>
                        <div><label class="block text-sm font-bold">Shipping Address</label><textarea required class="w-full border p-2 rounded mt-1" placeholder="House No, Street, Barangay, City"></textarea></div>
                        <div><label class="block text-sm font-bold">Payment Method</label><select class="w-full border p-2 rounded mt-1"><option>Cash on Delivery (COD)</option><option>GCash / Online Transfer</option><option>Credit Card</option></select></div>
                        <button type="submit" class="w-full bg-pink-600 text-white py-3 rounded-lg font-bold hover:bg-pink-700 shadow">Complete Order</button>
                    </form>
                </div>
            `;
        }

        function handleCheckout(e) {
            e.preventDefault();
            localStorage.setItem('cart', JSON.stringify([]));
            alert('🎉 Order placed successfully! Thank you for shopping with TinyTots Accessories.');
            router('catalog');
        }

        function renderDashboard(container) {
            if (!currentUser || currentUser.role !== 'admin') { return router('home'); }
            const products = JSON.parse(localStorage.getItem('products'));
            
            let tableRows = '';
            products.forEach(p => {
                tableRows += `
                    <tr class="border-b hover:bg-slate-50">
                        <td class="p-3"><img src="${p.image}" class="w-12 h-12 object-cover rounded"></td>
                        <td class="p-3 font-bold text-slate-800">${p.name}</td>
                        <td class="p-3"><span class="text-xs bg-slate-100 px-2 py-1 rounded border">${p.category}</span></td>
                        <td class="p-3 font-bold text-pink-600">$${p.price.toFixed(2)}</td>
                        <td class="p-3 space-x-2">
                            <button onclick="router('edit', ${p.id})" class="bg-blue-500 text-white px-3 py-1 rounded text-sm hover:bg-blue-600">Edit</button>
                            <button onclick="deleteProduct(${p.id})" class="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600">Delete</button>
                        </td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold text-pink-600">Admin Inventory Dashboard</h2>
                    <button onclick="resetData()" class="text-xs bg-slate-200 text-slate-700 px-3 py-1.5 rounded hover:bg-slate-300">Reset Default Products</button>
                </div>

                <div class="bg-white p-6 rounded-xl shadow mb-8">
                    <h3 class="text-xl font-bold mb-4 text-slate-800">Add New Accessory</h3>
                    <form onsubmit="addProduct(event)" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="add-name" placeholder="Product Name" required class="border p-2 rounded">
                            <select id="add-category" class="border p-2 rounded">
                                <option>Bibs & Pacifiers</option>
                                <option>Apparel</option>
                                <option>Toys & Teethers</option>
                                <option>Footwear & Socks</option>
                            </select>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="number" step="0.01" id="add-price" placeholder="Price ($)" required class="border p-2 rounded">
                            <input type="url" id="add-image" placeholder="Image URL" required class="border p-2 rounded">
                        </div>
                        <textarea id="add-desc" placeholder="Product Description" class="w-full border p-2 rounded"></textarea>
                        <button type="submit" class="bg-pink-600 text-white px-6 py-2 rounded font-bold hover:bg-pink-700">Add Product</button>
                    </form>
                </div>

                <div class="bg-white rounded-xl shadow overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="bg-slate-100 border-b text-slate-600 text-sm"><th class="p-3">Image</th><th class="p-3">Name</th><th class="p-3">Category</th><th class="p-3">Price</th><th class="p-3">Actions</th></tr></thead>
                        <tbody>${tableRows}</tbody>
                    </table>
                </div>
            `;
        }

        function addProduct(e) {
            e.preventDefault();
            let products = JSON.parse(localStorage.getItem('products'));
            products.push({
                id: Date.now(),
                name: document.getElementById('add-name').value,
                category: document.getElementById('add-category').value,
                price: parseFloat(document.getElementById('add-price').value),
                image: document.getElementById('add-image').value,
                description: document.getElementById('add-desc').value
            });
            localStorage.setItem('products', JSON.stringify(products));
            router('dashboard');
        }

        function deleteProduct(id) {
            if (confirm('Are you sure you want to delete this product?')) {
                let products = JSON.parse(localStorage.getItem('products')).filter(p => p.id !== id);
                localStorage.setItem('products', JSON.stringify(products));
                router('dashboard');
            }
        }

        function resetData() {
            if (confirm('Reset product catalog to default 8 items?')) {
                localStorage.setItem('products', JSON.stringify(initialProducts));
                router('dashboard');
            }
        }

        function renderEditProduct(container, id) {
            const products = JSON.parse(localStorage.getItem('products'));
            const p = products.find(prod => prod.id === id);
            if (!p) return router('dashboard');

            container.innerHTML = `
                <div class="max-w-xl mx-auto bg-white p-8 rounded-xl shadow">
                    <h2 class="text-2xl font-bold mb-6 text-pink-600">Edit Product</h2>
                    <form onsubmit="handleEdit(event, ${p.id})" class="space-y-4">
                        <div><label class="block text-sm font-bold">Name</label><input type="text" id="edit-name" value="${p.name}" required class="w-full border p-2 rounded mt-1"></div>
                        <div>
                            <label class="block text-sm font-bold">Category</label>
                            <select id="edit-cat" class="w-full border p-2 rounded mt-1">
                                <option ${p.category === 'Bibs & Pacifiers' ? 'selected' : ''}>Bibs & Pacifiers</option>
                                <option ${p.category === 'Apparel' ? 'selected' : ''}>Apparel</option>
                                <option ${p.category === 'Toys & Teethers' ? 'selected' : ''}>Toys & Teethers</option>
                                <option ${p.category === 'Footwear & Socks' ? 'selected' : ''}>Footwear & Socks</option>
                            </select>
                        </div>
                        <div><label class="block text-sm font-bold">Price ($)</label><input type="number" step="0.01" id="edit-price" value="${p.price}" required class="w-full border p-2 rounded mt-1"></div>
                        <div><label class="block text-sm font-bold">Image URL</label><input type="url" id="edit-image" value="${p.image}" required class="w-full border p-2 rounded mt-1"></div>
                        <div><label class="block text-sm font-bold">Description</label><textarea id="edit-desc" class="w-full border p-2 rounded mt-1">${p.description}</textarea></div>
                        <div class="flex gap-4"><button type="submit" class="bg-pink-600 text-white px-6 py-2 rounded font-bold">Save</button><button type="button" onclick="router('dashboard')" class="bg-slate-300 px-6 py-2 rounded font-bold">Cancel</button></div>
                    </form>
                </div>
            `;
        }

        function handleEdit(e, id) {
            e.preventDefault();
            let products = JSON.parse(localStorage.getItem('products'));
            let index = products.findIndex(p => p.id === id);
            if (index !== -1) {
                products[index] = {
                    id: id,
                    name: document.getElementById('edit-name').value,
                    category: document.getElementById('edit-cat').value,
                    price: parseFloat(document.getElementById('edit-price').value),
                    image: document.getElementById('edit-image').value,
                    description: document.getElementById('edit-desc').value
                };
                localStorage.setItem('products', JSON.stringify(products));
            }
            router('dashboard');
        }

        // Initial Route Load
        router('home');
    </script>
</body>
</html>
